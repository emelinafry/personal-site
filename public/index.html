<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emelina Fry</title>
    <meta name="description" content="Emelina Fry — personal page.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">Hello, I'm</p>
        <h1>Emelina Fry</h1>
        <div class="bio">
        {{BIO}}
        </div>
      </header>

      <!-- Edit these links: replace the href and label of each placeholder. -->
      <nav class="links" aria-label="Elsewhere">
        <a href="https://github.com/emelinafry">GitHub<span aria-hidden="true">↗</span></a>
        <a href="#">Website<span aria-hidden="true">↗</span></a>
        <a href="#">Email<span aria-hidden="true">↗</span></a>
      </nav>

      <section class="ask" aria-labelledby="ask-title" data-ready="{{ASSISTANT_READY}}">
        <h2 id="ask-title">Ask about me</h2>
        <p class="ask-note">Answers come only from the bio above.</p>
        <form id="ask-form" autocomplete="off">
          <label class="visually-hidden" for="ask-input">Your question</label>
          <input id="ask-input" name="question" type="text" maxlength="300"
                 placeholder="What does she do?" required>
          <button type="submit">Ask</button>
        </form>
        <p id="ask-answer" class="ask-answer" role="status" aria-live="polite"></p>
      </section>

      <footer class="footer">
        <p>© <span id="year">2026</span> Emelina Fry</p>
      </footer>
    </main>
  </body>
</html>
